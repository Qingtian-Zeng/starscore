name: StarScore delivery build

on:
  workflow_dispatch:
    inputs:
      app_api_url:
        description: Optional HTTPS API URL embedded in the debug APK
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Check, build Web and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_API_BASE_URL: ${{ inputs.app_api_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Run checks and tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run check 2>&1 | tee artifacts/check.log
      - name: Verify catalog, galaxy and audio lifecycle
        run: |
          set -o pipefail
          node scripts/check-catalog.mjs 2>&1 | tee artifacts/catalog-check.log
      - name: Build Web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/web-build.log
      - name: Build standalone competition preview
        run: node scripts/build-standalone.mjs artifacts/StarScore_Interactive_Preview.html
      - name: Generate branded Android icon and splash resources
        working-directory: apps/web
        run: |
          set -o pipefail
          npx --yes @capacitor/assets@3.0.5 generate --android 2>&1 | tee ../../artifacts/android-assets.log
      - name: Sync Capacitor
        run: npm run cap:sync --workspace @starscore/web
      - name: Assemble debug APK
        working-directory: apps/web/android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../../artifacts/android-build.log
      - name: Verify APK metadata and signature
        if: success()
        run: |
          set -o pipefail
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apps/web/android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts/apk-metadata.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apps/web/android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts/apk-signature.txt
      - name: Record artifact checksums
        if: success()
        run: sha256sum apps/web/android/app/build/outputs/apk/debug/app-debug.apk | tee artifacts/SHA256SUMS.txt
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: starscore-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload checks and build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: starscore-build-evidence
          path: artifacts/
          if-no-files-found: warn

  containers:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build and start Compose
        run: docker compose up --build -d
      - name: Verify Web, health and rule response
        run: node scripts/verify-deployment.mjs http://127.0.0.1:8080
      - name: Capture Compose evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-ps.txt
          docker compose logs --no-color > artifacts/compose.log
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: starscore-compose-evidence
          path: artifacts/
      - name: Stop Compose
        if: always()
        run: docker compose down --volumes
