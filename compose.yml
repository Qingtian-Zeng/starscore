services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      STARSCORE_CORS_ORIGINS: https://localhost
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
